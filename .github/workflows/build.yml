name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Build & test (Java 21 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Verify no preview / FFM usage
        run: |
          if grep -rn -- "--enable-preview\|import[[:space:]]\+java\.lang\.foreign" src/main pom.xml; then
            echo "::error::preview/FFM usage found (must stay stock Java 21 LTS)"; exit 1
          fi
          echo "no preview/FFM references"

      - name: License header check (spotless)
        run: mvn -B -ntp validate

      - name: Compile (no --enable-preview)
        run: mvn -B -ntp compile

      - name: Full test suite (PUC Lua 5.4.9 + unit)
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  test-jit-off:
    name: Build & test (JIT disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The conformance gate is "green with JIT on *and* off"; running it only
    # once meant the disabled path was verified by hand. JDK_JAVA_OPTIONS
    # reaches the forked surefire JVM (LuaState reads -Dluava.jit at class
    # initialisation, so a Maven-only property would arrive too late).
    env:
      JDK_JAVA_OPTIONS: -Dluava.jit=false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Full test suite (interpreter path)
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jit-off
          path: target/surefire-reports/
          if-no-files-found: ignore

  test-async-jit:
    name: Build & test (async JIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Full test suite (async JIT tier-up)
        run: mvn -B -ntp test -Dluava.jit.sync=false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-async-jit
          path: target/surefire-reports/
          if-no-files-found: ignore

  differential-fuzz-puc:
    name: Differential fuzz vs PUC Lua 5.4 C & binary verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PUC-Rio Lua 5.4 C reference toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4
          lua5.4 -v
          luac5.4 -v

      - name: Run mandatory PUC 5.4 differential fuzz and binary verifier suites
        run: |
          mvn -B -ntp test \
            -Dtest=RuntimeJitDifferentialFuzzTest,ChunkSerializerVerifierFuzzTest \
            -Dluava.test.requirePuc=true

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-differential-puc
          path: target/surefire-reports/
          if-no-files-found: ignore

  benchmark-smoke:
    name: Frontend JMH harness smoke (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install shaded engine and package JMH harness
        run: |
          ROOT_VER="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JMH_VER="$(mvn -B -ntp -f benchmarks/frontend-jmh/pom.xml help:evaluate -Dexpression=luava.version -q -DforceStdout)"
          if [ "$ROOT_VER" != "$JMH_VER" ]; then
            echo "::error::Version mismatch: root pom.xml=$ROOT_VER vs benchmarks/frontend-jmh/pom.xml luava.version=$JMH_VER"
            exit 1
          fi
          mvn -B -ntp install -DskipTests
          mvn -B -ntp -f benchmarks/frontend-jmh/pom.xml package -Dluava.version="$ROOT_VER"

      - name: List JMH benchmarks and run standalone smoke test from /tmp
        run: |
          JMH_JAR="$GITHUB_WORKSPACE/benchmarks/frontend-jmh/target/jmh-benchmarks.jar"
          cd /tmp
          java -jar "$JMH_JAR" -l
          java -Xms256m -Xmx1g -Dluava.jit=true -Dluava.jit.sync=true \
            -jar "$JMH_JAR" -f 0 -wi 1 -i 1 -w 50ms -r 50ms \
            "org.luava.bench.FrontendPipelineBenchmark\.(lexOnly|frontendCompileOnly|compileAndLoad)" \
            -p workload=jit_kernel
          java -Xms256m -Xmx1g -Dluava.jit=true -Dluava.jit.sync=true \
            -jar "$JMH_JAR" -f 0 -wi 1 -i 1 -w 50ms -r 50ms \
            "org.luava.bench.FrontendPipelineBenchmark\.jitCompile" \
            -p workload=jit_kernel,jit_oop_ctor
          java -Xms256m -Xmx1g -Dluava.jit=true -Dluava.jit.sync=true \
            -jar "$JMH_JAR" -f 0 -wi 1 -i 1 -w 50ms -r 50ms \
            "org.luava.bench.FrontendPipelineBenchmark\.warmExecute" \
            -p workload=exec_table_ops
